  <body class="bg-slate-950 text-white">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (registration) => {
              console.log('ZapChat ServiceWorker registered with scope:', registration.scope);
            },
            (error) => {
              console.log('ZapChat ServiceWorker registration failed:', error);
            }
          );
        });
      }
    </script>
